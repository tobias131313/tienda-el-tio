name: Bajar fotos
on:
  push:
    paths: ["herramientas/fotos_urls.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bajar-fotos-${{ github.ref }}
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python herramientas/bajar_fotos.py
      - name: Guardar fotos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add fotos productos.json herramientas/fotos_vacias.txt
          git diff --cached --quiet || git commit -q -m "Fotos de productos bajadas por código de barras"
          git push
