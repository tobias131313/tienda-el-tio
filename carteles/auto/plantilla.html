<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Carteles</title>
<style>
@font-face{font-family:"Archivo";font-weight:400;src:url(fonts/archivo-latin-400-normal.woff2)}
@font-face{font-family:"Archivo";font-weight:600;src:url(fonts/archivo-latin-600-normal.woff2)}
@font-face{font-family:"Archivo";font-weight:800;src:url(fonts/archivo-latin-800-normal.woff2)}
@font-face{font-family:"Archivo Black";src:url(fonts/archivo-black-latin-400-normal.woff2)}
:root{--paper:#fff;--ink:#111;--blue:#0b3fb8;--yellow:#ffd60a;
--display:"Archivo Black","Arial Black",Impact,sans-serif;--body:"Archivo","Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{font-family:var(--body);color:var(--ink)}
/* Hoja A4 a escala */
.sheet{width:100%;max-width:100%;aspect-ratio:210/297;background:var(--paper);box-shadow:0 2px 14px rgba(0,0,0,.18);border-radius:2px;overflow:hidden}
.grid{display:grid;height:100%;padding:2.5%}
/* Cartel: todo medido contra el tamaño del propio cartel (cqw/cqh) para que sirva en los 4 tamaños */
.c{container-type:size;border:1px dashed #b5b5b5;margin:-.5px;position:relative;overflow:hidden;background:var(--paper);color:var(--ink);min-width:0;min-height:0}
.in{position:absolute;inset:0;padding:6cqh 5cqw 5cqh;display:flex;flex-direction:column}
.marca{font-family:var(--body);font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#555;font-size:var(--fm);line-height:1.1;min-height:1.1em;padding-right:var(--tw)}
.nom{font-family:var(--body);font-weight:800;font-size:var(--fn);line-height:1.08;margin-top:1cqh;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.promo{font-family:var(--display);color:var(--blue);font-size:var(--fl);line-height:1;margin-top:auto}
.antes{font-weight:600;font-size:var(--fs);margin-top:auto}
.antes s{text-decoration-color:var(--blue);text-decoration-thickness:.12em}
.precio{font-family:var(--display);font-size:var(--fp);line-height:.95;letter-spacing:-.02em;white-space:nowrap;margin-top:auto}
.promo + .precio,.antes + .precio{margin-top:.6cqh}
.precio small{font-size:.45em;vertical-align:.7em;margin-right:.05em}
.precio .cu{font-size:.3em;vertical-align:0;letter-spacing:0}
.pie{display:flex;justify-content:space-between;align-items:flex-end;gap:3cqw;margin-top:2cqh;font-size:var(--fs);line-height:1.2;color:#333}
.pie .t{text-align:right}
.pie b{font-weight:800}
.pie svg{height:var(--hb);width:auto;max-width:50%;flex:none}
.c.of{background:var(--yellow)}
.c.of .marca{color:#5a4a00}
.c.of .precio{color:var(--blue)}
.tag{position:absolute;top:0;right:0;background:var(--blue);color:#fff;font-family:var(--display);font-size:var(--ft);padding:.35em .9em;letter-spacing:.04em;line-height:1}
/* Tamaños de letra por tipo (relativos al cartel) */
.t1 .c{--fm:7cqh;--fn:12.5cqh;--fl:12cqh;--fp:30cqh;--fs:6.4cqh;--ft:8cqh;--hb:14cqh;--tw:0}
.t3 .c{--fm:7cqh;--fn:11cqh;--fl:14cqh;--fp:34cqh;--fs:6.4cqh;--ft:9cqh;--hb:15cqh;--tw:24cqw}
.t4 .c{--fm:4.4cqh;--fn:7cqh;--fl:10cqh;--fp:min(24cqh,26cqw);--fs:3.6cqh;--ft:5.6cqh;--hb:8cqh;--tw:34cqw}
.t5 .c{--fm:5cqh;--fn:9cqh;--fl:11cqh;--fp:min(40cqh,24cqw);--fs:4.2cqh;--ft:8cqh;--hb:10cqh;--tw:24cqw}
.t1 .grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr))}
.t3 .grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr))}
.t4 .grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
.t5 .grid{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(3,minmax(0,1fr))}
@page{size:A4;margin:6mm}
html,body{margin:0;background:#fff}
.sheet{width:198mm;height:284mm;background:#fff;overflow:hidden;break-after:page}
</style>
<script src="JsBarcode.all.min.js"></script>
<script src="datos.js"></script>
</head><body><div id="hojas"></div>
<script>
// datos.js define: var HOY='05/11/26'; var CARTELES=[{nombre,precio,ean,cod,rubro},...]
var MARCAS=[['LA SERE.','La Serenísima'],['LA SERE','La Serenísima'],['LA SERENISIMA','La Serenísima'],['DON SATUR','Don Satur'],['3 ARROYOS','3 Arroyos'],['COCA COLA','Coca-Cola'],['VILLA DEL SUR','Villa del Sur'],['LA CAMPAGNOLA','La Campagnola'],['LA VIRGINIA','La Virginia'],['SAN IGNACIO','San Ignacio']];
var SIN_MARCA=/verduler|fruta|carnic|fiambr|panader/i;
function fmt(n){return Math.round(n).toLocaleString('es-AR');}
function tc(w){return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();}
function armar(x){
  var s=(x.nombre||'').trim().replace(/\s+/g,' '), u=s.toUpperCase(), m=null, p=x.precio;
  for(var i=0;i<MARCAS.length;i++){var k=MARCAS[i][0]; if(u.indexOf(k+' ')===0){m=MARCAS[i][1]; s=s.slice(k.length).trim(); break;}}
  if(m===null){ if(SIN_MARCA.test(x.rubro||'')) m=''; else { var w=s.split(' ')[0]; m=tc(w); s=s.slice(w.length).trim(); } }
  var U=s.toUpperCase(), kg='';
  if(/(EL KILO|X ?KILO|X ?KGS?\.?$)/.test(U)) kg='Precio por kg <b>$'+fmt(p)+'</b>';
  else { var r=/X?\s*(\d+(?:[.,]\d+)?)\s*(KGR?S?\.?|KILO|GRS?\.?|GR\.?|ML|CM3?|CC|LTR?S?\.?|LT\.?|K|L)(?![A-Z])/.exec(U);
    if(r){var q=parseFloat(r[1].replace(',','.')),un=r[2],g; if(un[0]=='K') g=q<50?q*1000:q; else if(un[0]=='L') g=q*1000; else g=q;
      var lab=(un[0]=='K'||un[0]=='G')?'kg':'litro'; if(g>0) kg='Precio por '+lab+' <b>$'+fmt(p*1000/g)+'</b>';}}
  var n=s.charAt(0).toUpperCase()+s.slice(1).toLowerCase(); n=n.replace(/\bx\s*(\d)/g,'x $1');
  return {m:m,n:n,p:p,kg:kg||'&nbsp;',ean:x.ean,cod:x.cod};
}
function cartel(x){
  var top=[x.m,(!x.ean&&x.cod)?'Cód. '+x.cod:(x.cod?'Int. '+x.cod:'')].filter(Boolean).join(' · ');
  return '<div class="c"><div class="in"><span class="marca">'+top+'</span><span class="nom">'+x.n+'</span>'+
   '<span class="precio"><small>$</small>'+fmt(x.p)+'</span><div class="pie">'+(x.ean?'<svg data-ean="'+x.ean+'"></svg>':'<span></span>')+
   '<span class="t">'+x.kg+'<br>Impreso '+HOY+'</span></div></div></div>';
}
var D=CARTELES.map(armar), h='';
for(var i=0;i<D.length;i+=24){h+='<div class="sheet t1"><div class="grid">';
  D.slice(i,i+24).forEach(function(x){h+=cartel(x);}); h+='</div></div>';}
document.getElementById('hojas').innerHTML=h;
document.querySelectorAll('svg[data-ean]').forEach(function(el){
  try{JsBarcode(el,el.dataset.ean,{format:'CODE128',displayValue:true,fontSize:18,height:56,margin:0,background:'transparent',lineColor:'#111'});}catch(e){el.remove();}
});
</script></body></html>
