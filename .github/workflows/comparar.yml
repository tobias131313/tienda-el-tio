name: Comparar fuentes
on:
  push:
    paths: ["herramientas/comparar.json"]
permissions:
  contents: write
jobs:
  comparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: cd herramientas && python -c "import sys; sys.argv=['x']" && cd .. && PYTHONPATH=herramientas python herramientas/comparar_fuentes.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add herramientas/comparacion.jpg && git commit -q -m "Comparación de fotos por tienda (temporal)" && git push
